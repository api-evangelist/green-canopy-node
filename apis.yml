name: Green Canopy NODE
description: >-
  Green Canopy NODE is a Seattle- and Portland-based sustainable real estate
  development and construction technology company that designs and builds
  all-electric, low-carbon homes. The business operates across three lines:
  prefabricated "Building Kits" (including mass-timber panelized systems),
  full development services for multi-unit and infill housing projects, and
  impact investment funds that finance green housing. The company reports 300+
  all-electric homes built, five real estate investment funds, and roughly 35K
  metric tons of greenhouse-gas emissions mitigated since inception. Green
  Canopy NODE was surfaced as a Techstars portfolio company and added to the
  API Evangelist network. It publishes a marketing and investor website but no
  public developer program, API, or machine-readable API surface at this time.
